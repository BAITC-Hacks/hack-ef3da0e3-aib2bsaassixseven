name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --directory backend --locked --all-groups
      - run: uv run --directory backend pytest -q
      - run: uv run --directory backend ruff check .
      - run: uv run --directory backend pyright

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: Tirke
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: replace-with-publishable-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect GPU package
        id: gpu_package
        run: |
          if [ -f gpu/pyproject.toml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.gpu_package.outputs.available == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        if: steps.gpu_package.outputs.available == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: gpu/uv.lock
      - run: uv sync --directory gpu --locked --all-groups
        if: steps.gpu_package.outputs.available == 'true'
      - run: uv run --directory gpu pytest -q
        if: steps.gpu_package.outputs.available == 'true'
      - run: uv run --directory gpu ruff check .
        if: steps.gpu_package.outputs.available == 'true'
      - run: uv run --directory gpu pyright
        if: steps.gpu_package.outputs.available == 'true'
