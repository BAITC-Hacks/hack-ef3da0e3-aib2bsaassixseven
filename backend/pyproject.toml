[project]
name = "hackalem-api"
version = "0.1.0"
description = "FastAPI service for the Hackalem hackathon starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "supabase",
]

[project.optional-dependencies]
ml = [
    "accelerate>=1.12,<2",
    "faster-whisper==1.2.1",
    "huggingface-hub>=1.4,<2",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "pyannote.audio==4.0.4",
    "sentencepiece>=0.2,<1",
    "soundfile>=0.13,<1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.12.1",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "httpx",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
